<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistem Informasi Organisasi</title>

    <!-- SDK Supabase versi UMD -->
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-card {
            background: #ffffff;
            width: 100%;
            max-width: 580px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .user-info h3 {
            margin: 0 0 5px 0;
            color: #2d3748;
            font-size: 18px;
        }
        .user-info p {
            margin: 0;
            color: #718096;
            font-size: 13px;
        }
        .btn-logout {
            background-color: #fed7d7;
            color: #c53030;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-logout:hover {
            background-color: #feb2b2;
        }
        h1 {
            color: #7a202c;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }
        h2 {
            color: #1a202c;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
        }
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background-color: #fff;
            color: #2d3748;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        select:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }
        .hidden {
            display: none !important;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            border-radius: 4px;
            color: #2b6cb0;
            font-size: 13px;
            line-height: 1.5;
        }
        .btn-submit {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <!-- Informasi User & Tombol Keluar -->
        <div class="user-header">
            <div class="user-info">
                <h3 id="user-name">Memuat...</h3>
                <p id="user-email">-</p>
            </div>
            <button class="btn-logout" onclick="handleLogout()">Keluar</button>
        </div>

        <h1>P R E M I U M</h1>
        <h2>Portal Layanan Organisasi</h2>
        <p class="subtitle">Silakan pilih bidang dan sub-bagian terkait sesuai struktur kerja.</p>

        <!-- Pilihan Utama (Dropdown 1) -->
        <div class="form-group">
            <label for="main-category">Pilih Bagian / Bidang Utama</label>
            <select id="main-category" onchange="handleMainCategoryChange()">
                <option value="" disabled selected>-- Pilih Bagian / Bidang --</option>
                <option value="umum">Bagian Umum</option>
                <option value="produksi">Bidang Produksi Statistik</option>
                <option value="pengolahan-diseminasi-evaluasi">Bidang Pengolahan, Diseminasi, dan Evaluasi Statistik</option>
            </select>
        </div>

        <!-- Dropdown Turunan: Bagian Umum -->
        <div class="form-group hidden" id="group-umum">
            <label for="sub-umum">Pilih Rincian Unit / Kegiatan (Bagian Umum)</label>
            <select id="sub-umum" onchange="checkFinalSelection()">
                <option value="" disabled selected>-- Pilih Rincian Unit Kerja --</option>
                <option value="Penyusunan rencana program, kegiatan, dan anggaran">Penyusunan rencana program, kegiatan, dan anggaran</option>
                <option value="Pelaksanaan urusan keuangan dan barang milik negara">Pelaksanaan urusan keuangan dan barang milik negara</option>
                <option value="Pengelolaan urusan administrasi sumber daya manusia">Pengelolaan urusan administrasi sumber daya manusia</option>
                <option value="Pelaksanaan urusan hubungan masyarakat, administrasi kerja sama, hukum, kearsipan, dan persandian">Pelaksanaan urusan hubungan masyarakat, administrasi kerja sama, hukum, kearsipan, dan persandian</option>
                <option value="Penyiapan penataan organisasi dan tata laksana, administrasi dan fasilitasi reformasi birokrasi">Penyiapan penataan organisasi dan tata laksana, administrasi dan fasilitasi reformasi birokrasi</option>
                <option value="Pelaksanaan manajemen risiko, pemantauan, analisis, evaluasi, dan penyusunan laporan">Pelaksanaan manajemen risiko, pemantauan, analisis, evaluasi, dan penyusunan laporan</option>
                <option value="Pelaksanaan urusan ketatausahaan, serta perlengkapan dan rumah tangga">Pelaksanaan urusan ketatausahaan, serta perlengkapan dan rumah tangga</option>
            </select>
        </div>

        <!-- Dropdown Turunan: Bidang Produksi Statistik -->
        <div class="form-group hidden" id="group-produksi">
            <label for="sub-produksi">Pilih Rincian Unit / Kegiatan (Bidang Produksi Statistik)</label>
            <select id="sub-produksi" onchange="checkFinalSelection()">
                <option value="" disabled selected>-- Pilih Rincian Unit Kerja --</option>
                <option value="Penyiapan tugas teknis bidang produksi statistik">Penyiapan tugas teknis bidang produksi statistik</option>
                <option value="Pelaksanaan tugas teknis bidang produksi statistik">Pelaksanaan tugas teknis bidang produksi statistik</option>
                <option value="Koordinasi tugas teknis bidang produksi statistik">Koordinasi tugas teknis bidang produksi statistik</option>
                <option value="Pembinaan tugas teknis bidang produksi statistik">Pembinaan tugas teknis bidang produksi statistik</option>
                <option value="Pengendalian tugas teknis bidang produksi statistik">Pengendalian tugas teknis bidang produksi statistik</option>
            </select>
        </div>

        <!-- Dropdown Utama Level 2: Bidang Pengolahan, Diseminasi, dan Evaluasi Statistik -->
        <div class="form-group hidden" id="group-pde-main">
            <label for="sub-pde-main">Pilih Kategori Bidang</label>
            <select id="sub-pde-main" onchange="handlePdeMainChange()">
                <option value="" disabled selected>-- Pilih Kategori --</option>
                <option value="pengolahan">Pengolahan</option>
                <option value="diseminasi">Diseminasi</option>
                <option value="evaluasi">Evaluasi</option>
            </select>
        </div>

        <!-- Dropdown Turunan Level 3: Pengolahan -->
        <div class="form-group hidden" id="group-pde-pengolahan">
            <label for="sub-pde-pengolahan">Pilih Rincian Kegiatan (Pengolahan)</label>
            <select id="sub-pde-pengolahan" onchange="checkFinalSelection()">
                <option value="" disabled selected>-- Pilih Kegiatan Pengolahan --</option>
                <option value="Pelaksanaan Pengolahan">Pelaksanaan Pengolahan</option>
                <option value="Pembinaan Pengolahan">Pembinaan Pengolahan</option>
                <option value="Koordinasi Pengolahan">Koordinasi Pengolahan</option>
                <option value="Pemantauan Pengolahan">Pemantauan Pengolahan</option>
                <option value="Analisis Pengolahan">Analisis Pengolahan</option>
                <option value="Evaluasi Pengolahan">Evaluasi Pengolahan</option>
                <option value="Pelaporan Pengolahan">Pelaporan Pengolahan</option>
            </select>
        </div>

        <!-- Dropdown Turunan Level 3: Diseminasi -->
        <div class="form-group hidden" id="group-pde-diseminasi">
            <label for="sub-pde-diseminasi">Pilih Rincian Kegiatan (Diseminasi)</label>
            <select id="sub-pde-diseminasi" onchange="checkFinalSelection()">
                <option value="" disabled selected>-- Pilih Kegiatan Diseminasi --</option>
                <option value="Pelaksanaan Diseminasi">Pelaksanaan Diseminasi</option>
                <option value="Pembinaan Diseminasi">Pembinaan Diseminasi</option>
                <option value="Koordinasi Diseminasi">Koordinasi Diseminasi</option>
                <option value="Pemantauan Diseminasi">Pemantauan Diseminasi</option>
                <option value="Analisis Diseminasi">Analisis Diseminasi</option>
                <option value="Evaluasi Diseminasi">Evaluasi Diseminasi</option>
                <option value="Pelaporan Diseminasi">Pelaporan Diseminasi</option>
            </select>
        </div>

        <!-- Dropdown Turunan Level 3: Evaluasi -->
        <div class="form-group hidden" id="group-pde-evaluasi">
            <label for="sub-pde-evaluasi">Pilih Rincian Kegiatan (Evaluasi)</label>
            <select id="sub-pde-evaluasi" onchange="checkFinalSelection()">
                <option value="" disabled selected>-- Pilih Kegiatan Evaluasi --</option>
                <option value="Pelaksanaan evaluasi penyelenggaraan dan penjaminan kualitas">Pelaksanaan evaluasi penyelenggaraan dan penjaminan kualitas</option>
                <option value="Pemantauan evaluasi penyelenggaraan dan penjaminan kualitas">Pemantauan evaluasi penyelenggaraan dan penjaminan kualitas</option>
                <option value="Analisis evaluasi penyelenggaraan dan penjaminan kualitas">Analisis evaluasi penyelenggaraan dan penjaminan kualitas</option>
                <option value="Evaluasi evaluasi penyelenggaraan dan penjaminan kualitas">Evaluasi evaluasi penyelenggaraan dan penjaminan kualitas</option>
                <option value="Pelaporan evaluasi penyelenggaraan dan penjaminan kualitas">Pelaporan evaluasi penyelenggaraan dan penjaminan kualitas</option>
            </select>
        </div>

        <!-- Kotak Informasi Pilihan & Tombol Lanjut -->
        <div id="result-container" class="result-box hidden">
            <strong>Pilihan Anda:</strong> <span id="selected-summary">-</span>
            <button id="btn-goto-url" class="btn-submit hidden" onclick="navigateToTargetUrl()">Lanjut ke Halaman Tujuan</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vgrbmudehaqlhrneqyxm.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_2NptgOcQUYnDVl92DYB5KQ_7O_P29zh";

        let sb;
        let finalPathData = "";

        try {
            const { createClient } = window.supabase;
            sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Validasi Sesi: Pastikan user benar-benar login
            sb.auth.getSession().then(({ data: { session } }) => {
                if (!session) {
                    window.location.href = "index.html";
                } else {
                    const user = session.user;
                    const name = user.user_metadata?.full_name || "Pengguna";
                    const email = user.email;

                    document.getElementById("user-name").innerText = name;
                    document.getElementById("user-email").innerText = email;
                }
            });

        } catch (err) {
            console.error(err);
            window.location.href = "index.html";
        }

        function handleMainCategoryChange() {
            const mainVal = document.getElementById("main-category").value;

            // Sembunyikan semua sub-dropdown turunan
            document.getElementById("group-umum").classList.add("hidden");
            document.getElementById("group-produksi").classList.add("hidden");
            document.getElementById("group-pde-main").classList.add("hidden");
            document.getElementById("group-pde-pengolahan").classList.add("hidden");
            document.getElementById("group-pde-diseminasi").classList.add("hidden");
            document.getElementById("group-pde-evaluasi").classList.add("hidden");

            // Reset nilai pilihan seluruh sub-dropdown
            document.getElementById("sub-umum").selectedIndex = 0;
            document.getElementById("sub-produksi").selectedIndex = 0;
            document.getElementById("sub-pde-main").selectedIndex = 0;
            document.getElementById("sub-pde-pengolahan").selectedIndex = 0;
            document.getElementById("sub-pde-diseminasi").selectedIndex = 0;
            document.getElementById("sub-pde-evaluasi").selectedIndex = 0;

            // Sembunyikan kotak hasil
            document.getElementById("result-container").classList.add("hidden");

            // Tampilkan dropdown level berikutnya sesuai pilihan utama
            if (mainVal === "umum") {
                document.getElementById("group-umum").classList.remove("hidden");
            } else if (mainVal === "produksi") {
                document.getElementById("group-produksi").classList.remove("hidden");
            } else if (mainVal === "pengolahan-diseminasi-evaluasi") {
                document.getElementById("group-pde-main").classList.remove("hidden");
            }
        }

        function handlePdeMainChange() {
            const pdeVal = document.getElementById("sub-pde-main").value;

            // Sembunyikan sub-dropdown turunan level 3
            document.getElementById("group-pde-pengolahan").classList.add("hidden");
            document.getElementById("group-pde-diseminasi").classList.add("hidden");
            document.getElementById("group-pde-evaluasi").classList.add("hidden");

            document.getElementById("sub-pde-pengolahan").selectedIndex = 0;
            document.getElementById("sub-pde-diseminasi").selectedIndex = 0;
            document.getElementById("sub-pde-evaluasi").selectedIndex = 0;

            document.getElementById("result-container").classList.add("hidden");

            if (pdeVal === "pengolahan") {
                document.getElementById("group-pde-pengolahan").classList.remove("hidden");
            } else if (pdeVal === "diseminasi") {
                document.getElementById("group-pde-diseminasi").classList.remove("hidden");
            } else if (pdeVal === "evaluasi") {
                document.getElementById("group-pde-evaluasi").classList.remove("hidden");
            }
        }

        function checkFinalSelection() {
            const mainVal = document.getElementById("main-category").value;
            let summaryText = "";
            let isComplete = false;

            if (mainVal === "umum") {
                const sub = document.getElementById("sub-umum").value;
                if (sub) {
                    summaryText = `Bagian Umum ➔ ${sub}`;
                    isComplete = true;
                }
            } else if (mainVal === "produksi") {
                const sub = document.getElementById("sub-produksi").value;
                if (sub) {
                    summaryText = `Bidang Produksi Statistik ➔ ${sub}`;
                    isComplete = true;
                }
            } else if (mainVal === "pengolahan-diseminasi-evaluasi") {
                const pdeMain = document.getElementById("sub-pde-main").value;
                if (pdeMain === "pengolahan") {
                    const sub = document.getElementById("sub-pde-pengolahan").value;
                    if (sub) {
                        summaryText = `Bidang PDE ➔ Pengolahan ➔ ${sub}`;
                        isComplete = true;
                    }
                } else if (pdeMain === "diseminasi") {
                    const sub = document.getElementById("sub-pde-diseminasi").value;
                    if (sub) {
                        summaryText = `Bidang PDE ➔ Diseminasi ➔ ${sub}`;
                        isComplete = true;
                    }
                } else if (pdeMain === "evaluasi") {
                    const sub = document.getElementById("sub-pde-evaluasi").value;
                    if (sub) {
                        summaryText = `Bidang PDE ➔ Evaluasi ➔ ${sub}`;
                        isComplete = true;
                    }
                }
            }

            if (isComplete) {
                finalPathData = summaryText;
                document.getElementById("selected-summary").innerText = summaryText;
                document.getElementById("result-container").classList.remove("hidden");
                document.getElementById("btn-goto-url").classList.remove("hidden");
            } else {
                document.getElementById("result-container").classList.add("hidden");
                document.getElementById("btn-goto-url").classList.add("hidden");
            }
        }

        function navigateToTargetUrl() {
            // Placeholder: URL tujuan dapat ditambahkan atau disesuaikan di sini nanti
            // Contoh: window.location.href = "halaman-tujuan.html?path=" + encodeURIComponent(finalPathData);
            alert("Pilihan final tercatat:\n" + finalPathData + "\n\n(URL tujuan akan diarahkan ke sini sesuai konfigurasi berikutnya).");
        }

        async function handleLogout() {
            try {
                await sb.auth.signOut();
                window.location.href = "index.html";
            } catch (err) {
                console.error("Gagal logout:", err);
            }
        }
    </script>
</body>
</html>
